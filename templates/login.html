<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samba Web Panel [{{ hostname }}] — Вход</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        // Немедленно применяем сохраненную тему до отрисовки интерфейса
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.documentElement.classList.add('light-theme');
        }
        const savedPalette = localStorage.getItem('theme_palette') || 'classic';
        document.documentElement.setAttribute('data-palette', savedPalette);
    </script>
</head>
<body class="login-body">

    <div style="position: absolute; top: 24px; right: 24px; display: flex; gap: 8px; align-items: center;">
        <div class="palette-picker-dropdown">
            <button id="palette-toggle-btn" class="btn-icon-toggle" title="Выбрать цветовую тему">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/>
                    <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/>
                    <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/>
                    <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/>
                    <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>
                </svg>
            </button>
            <div id="paletteMenu" class="palette-menu hidden">
                <div class="palette-menu-header">Цветовая палитра</div>
                <div class="palette-options">
                    <button type="button" class="palette-option" data-palette-val="classic">
                        <span class="palette-preview" style="background: linear-gradient(135deg, #141416 50%, #e4e4e7 50%);"></span>
                        <span class="palette-label">Classic Zinc</span>
                    </button>
                    <button type="button" class="palette-option" data-palette-val="cyber_lime">
                        <span class="palette-preview" style="background: linear-gradient(135deg, #0a0a0a 50%, #b6ff00 50%);"></span>
                        <span class="palette-label">Cyber Lime</span>
                    </button>
                    <button type="button" class="palette-option" data-palette-val="electric_blue">
                        <span class="palette-preview" style="background: linear-gradient(135deg, #101a46 50%, #245bff 50%);"></span>
                        <span class="palette-label">Electric Blue</span>
                    </button>
                    <button type="button" class="palette-option" data-palette-val="crimson">
                        <span class="palette-preview" style="background: linear-gradient(135deg, #080808 50%, #c1121f 50%);"></span>
                        <span class="palette-label">Crimson Red</span>
                    </button>
                    <button type="button" class="palette-option" data-palette-val="rust_orange">
                        <span class="palette-preview" style="background: linear-gradient(135deg, #24150f 50%, #d96b27 50%);"></span>
                        <span class="palette-label">Rust Orange</span>
                    </button>
                    <button type="button" class="palette-option" data-palette-val="graphite_pink">
                        <span class="palette-preview" style="background: linear-gradient(135deg, #292929 50%, #c88e9b 50%);"></span>
                        <span class="palette-label">Graphite Pink</span>
                    </button>
                </div>
            </div>
        </div>
        <button id="theme-toggle" class="btn-icon-toggle" title="Переключить тему">
            <!-- Sun Icon (shown in dark theme) -->
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            <!-- Moon Icon (shown in light theme) -->
            <svg class="moon-icon hidden" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
    </div>

    <div class="login-wrapper">
        <div class="login-card glass">
            <div class="login-header">
                <div class="logo-box big">S</div>
                <h2>SAMBA <span class="accent-text">PANEL</span></h2>
                <p>{% if auth_mode == 'standalone' %}Автономный режим (Standalone){% else %}Вход через Central Auth (SSO){% endif %}</p>
            </div>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Имя пользователя</label>
                    <input type="text" id="username" autocomplete="username" placeholder="Введите имя пользователя" required>
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" autocomplete="current-password" placeholder="Введите пароль" required>
                </div>
                
                <button type="submit" id="submitBtn" class="btn-submit wide">Войти</button>
            </form>
            
            <div id="errorMessage" class="error-msg text-center" style="display: none; margin-top: 16px;"></div>
        </div>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');

            errorDiv.style.display = 'none';
            submitBtn.innerText = 'Вход...';
            submitBtn.disabled = true;

            try {
                const response = await fetch(`./login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    window.location.href = `./`;
                } else {
                    errorDiv.innerText = result.error || 'Ошибка входа';
                    errorDiv.style.display = 'block';
                    submitBtn.innerText = 'Войти';
                    submitBtn.disabled = false;
                }
            } catch (err) {
                errorDiv.innerText = 'Ошибка соединения с сервером';
                errorDiv.style.display = 'block';
                submitBtn.innerText = 'Войти';
                submitBtn.disabled = false;
            }
        }

        window.addEventListener('load', () => {
            const themeToggleBtn = document.getElementById('theme-toggle');
            const sunIcon = themeToggleBtn.querySelector('.sun-icon');
            const moonIcon = themeToggleBtn.querySelector('.moon-icon');

            if (document.documentElement.classList.contains('light-theme')) {
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
            }

            themeToggleBtn.addEventListener('click', () => {
                document.documentElement.classList.toggle('light-theme');
                const isLight = document.documentElement.classList.contains('light-theme');
                localStorage.setItem('theme', isLight ? 'light' : 'dark');
                
                if (isLight) {
                    sunIcon.classList.add('hidden');
                    moonIcon.classList.remove('hidden');
                } else {
                    sunIcon.classList.remove('hidden');
                    moonIcon.classList.add('hidden');
                }
            });

            // Инициализация палитры оформления
            const savedPalette = localStorage.getItem('theme_palette') || 'classic';
            document.documentElement.setAttribute('data-palette', savedPalette);
            const paletteBtn = document.getElementById('palette-toggle-btn');
            const paletteMenu = document.getElementById('paletteMenu');
            if (paletteBtn && paletteMenu) {
                const updateActivePalette = (p) => {
                    paletteMenu.querySelectorAll('.palette-option').forEach(btn => {
                        btn.classList.toggle('active', btn.dataset.paletteVal === p);
                    });
                };
                updateActivePalette(savedPalette);
                paletteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    paletteMenu.classList.toggle('hidden');
                });
                document.addEventListener('click', (e) => {
                    if (!paletteMenu.contains(e.target) && !paletteBtn.contains(e.target)) {
                        paletteMenu.classList.add('hidden');
                    }
                });
                paletteMenu.querySelectorAll('.palette-option').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const p = btn.dataset.paletteVal;
                        document.documentElement.setAttribute('data-palette', p);
                        localStorage.setItem('theme_palette', p);
                        updateActivePalette(p);
                        paletteMenu.classList.add('hidden');
                    });
                });
            }
        });
    </script>
</body>
</html>
