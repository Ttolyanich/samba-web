services:
  samba-web:
    image: ghcr.io/ttolyanich/samba-web:latest
    # build: .
    container_name: samba-web
    restart: always
    ports:
      - "${BIND_HOST:-127.0.0.1}:${BIND_PORT:-5003}:${BIND_PORT:-5003}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    # Полная стерилизация: контейнер не имеет root-привилегий и изоляция хоста не нарушается
    # Никаких privileged: true, никаких pid: host, никакого nsenter
    
    volumes:
      # Папка для сохранения базы данных (журнал аудита, ссылки)
      - ./data:/app/data
      # Монтируем конфигурацию Samba с хоста в режиме только для чтения
      - /etc/samba/smb.conf:/etc/samba/smb.conf:ro
      # Локальный Unix domain socket для взаимодействия с samba-agent на хосте
      - /run/samba-agent/samba-agent.sock:/run/samba-agent.sock
      
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - CENTRAL_AUTH_URL=${CENTRAL_AUTH_URL}
      - NODE_API_TOKEN=${NODE_API_TOKEN}
      - NODE_NAME=${NODE_NAME}
      - BIND_HOST=${BIND_HOST:-0.0.0.0}
      - BIND_PORT=${BIND_PORT:-5003}
      - SMB_CONF_PATH=${SMB_CONF_PATH:-/etc/samba/smb.conf}
      - VERIFY_SSL=${VERIFY_SSL:-true}
      - DATABASE_PATH=/app/data/samba-node.db
      - SAMBA_AGENT_SOCKET=/run/samba-agent.sock
    command: gunicorn --workers 2 --bind 0.0.0.0:${BIND_PORT:-5003} app:app
